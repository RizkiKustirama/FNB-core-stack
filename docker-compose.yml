services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: fnb-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fnb_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fnb_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Web F&B ERP & POS Next.js Application (Bun Runtime)
  fnb-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fnb-web-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/fnb_db?schema=public
      - NEXTAUTH_SECRET=fnb-pos-super-secret-key-change-in-prod
      - NEXTAUTH_URL=http://localhost:3000
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Optional pgAdmin 4 Web GUI (Akses di http://localhost:5050)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fnb-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fnb.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
